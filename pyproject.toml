[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-parallel"
dynamic = ["version"]
description = "Pluggable parallel task execution helpers (threading, joblib, dask, ray)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Andrea Gemma" }
]
keywords = ["parallel", "concurrency", "dask", "ray", "joblib", "multiprocessing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed"
]
dependencies = [
  "ga-serializer>=0.1.0"
]

[project.optional-dependencies]
dask = [
  "dask>=2026.1",
  "distributed>=2026.1"
]
ray = [
  "ray>=2.9"
]
joblib = [
  "joblib>=1.4"
]
all = [
  "dask[distributed]>=2024.1",
  "distributed>=2024.1",
  "ray>=2.9",
  "joblib>=1.4"
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.1"
]

[project.urls]
Documentation = "https://github.com/andreagemma/parallel#readme"
Issues = "https://github.com/andreagemma/parallel/issues"
Source = "https://github.com/andreagemma/parallel"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parallel = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "parallel._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["parallel"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  ".venv",
  "build",
  "dist",
  "src/parallel.egg-info",
  "venv"
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
files = ["src/parallel"]
warn_unused_configs = true
check_untyped_defs = true
follow_imports = "skip"
no_site_packages = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["parallel.parallel"]
ignore_errors = true
